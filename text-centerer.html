<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Centerer</title>
<style>
  *{box-sizing:border-box;}
  body{ margin:0; background:#ffffff; color:#000000; font-family:sans-serif; padding:36px 16px 60px; }
  .wrap{ max-width:520px; margin:0 auto; }
  h1{ font-size:24px; font-weight:700; margin:0 0 28px; text-align:center; }
  label{ display:block; font-size:13px; margin-bottom:8px; }
  textarea{ width:100%; min-height:130px; font-family:sans-serif; font-size:14px; line-height:1.6; padding:12px; border:1px solid #000000; background:#ffffff; color:#000000; resize:vertical; }
  textarea:focus{ outline:2px solid #000000; outline-offset:1px; }
  section{ margin-bottom:22px; }
  .output-wrap{ position:relative; }
  #output{ background:#ffffff; color:#000000; }
  .copy-btn{ position:absolute; top:9px; right:9px; font-family:sans-serif; font-size:11px; padding:6px 12px; background:#000000; color:#ffffff; border:none; cursor:pointer; }
  .copy-btn.copied{ background:#555555; }
  .copied-overlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(255,255,255,0.92);
    font-size:16px;
    font-weight:700;
    pointer-events:none;
    opacity:0;
    transition:opacity 0.15s;
  }
  .copied-overlay.show{ opacity:1; }
  .footer{ text-align:center; font-size:12px; margin-top:34px; }
  .footer a{ color:#000000; text-decoration:none; border-bottom:1px solid #000000; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Text Centerer</h1>
  <section>
    <label for="input">Input</label>
    <textarea id="input" placeholder="type your tweet here to center it"></textarea>
  </section>
  <section>
    <label for="output">Output</label>
    <div class="output-wrap">
      <textarea id="output" readonly onclick="copyOutput()"></textarea>
      <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy</button>
      <div class="copied-overlay" id="copiedOverlay">Copied!</div>
    </div>
  </section>
  <div class="footer">made by <a href="https://x.com/alloysavvy" target="_blank">@alloysavvy</a></div>
</div>
<script>
const PAD_CHAR = '\u2800';
const FONT = '16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

const BASE_TARGET = 300;

const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d');
ctx.font = FONT;

function textWidthPx(str){ return ctx.measureText(str).width; }

function wrapLine(line, maxWidth){
  if(textWidthPx(line) <= maxWidth) return [line];
  const words = line.split(' ');
  const result = [];
  let current = '';
  for(const word of words){
    const test = current ? current + ' ' + word : word;
    if(textWidthPx(test) <= maxWidth || !current){
      current = test;
    } else {
      result.push(current);
      current = word;
    }
  }
  if(current) result.push(current);
  return result;
}

function centerIt(){
  const raw = document.getElementById('input').value.replace(/\r\n/g, '\n');
  const rawLines = raw.split('\n');
  const nonEmpty = rawLines.filter(l => l.trim().length > 0);
  if(nonEmpty.length === 0){
    document.getElementById('output').value = '';
    return;
  }

  const target = Math.max(BASE_TARGET, 60);

  const wrapped = [];
  for(const line of rawLines){
    if(line.trim().length === 0){ wrapped.push(line); continue; }
    wrapped.push(...wrapLine(line, target));
  }

  const padCharWidth = textWidthPx(PAD_CHAR) || 8;
  const padded = wrapped.map(line => {
    if(line.trim().length === 0) return line;
    const diff = target - textWidthPx(line);
    const padCount = Math.max(0, Math.round(diff / 2 / padCharWidth));
    return PAD_CHAR.repeat(padCount) + line;
  });

  const finalLines = [PAD_CHAR, '', ...padded, '', PAD_CHAR];
  const output = finalLines.join('\n');
  document.getElementById('output').value = output;
}

function copyOutput(){
  const ta = document.getElementById('output');
  if(!ta.value) return;
  const btn = document.getElementById('copyBtn');
  const overlay = document.getElementById('copiedOverlay');
  const done = () => {
    btn.textContent = 'Copied!'; btn.classList.add('copied');
    overlay.classList.add('show');
    setTimeout(() => {
      btn.textContent = 'Copy'; btn.classList.remove('copied');
      overlay.classList.remove('show');
    }, 1300);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(ta.value).then(done).catch(() => { ta.select(); document.execCommand('copy'); done(); });
  } else { ta.select(); document.execCommand('copy'); done(); }
}
const LINE_CHAR_LIMIT = 30;

function enforceLineLimit(){
  const ta = document.getElementById('input');
  const text = ta.value;
  const cursor = ta.selectionStart;

  const lineStart = text.lastIndexOf('\n', cursor - 1) + 1;
  let lineEnd = text.indexOf('\n', cursor);
  if(lineEnd === -1) lineEnd = text.length;
  const currentLine = text.slice(lineStart, lineEnd);

  if(currentLine.length <= LINE_CHAR_LIMIT) return;

  let breakAt = currentLine.lastIndexOf(' ', LINE_CHAR_LIMIT);
  if(breakAt <= 0) breakAt = LINE_CHAR_LIMIT;

  const before = currentLine.slice(0, breakAt).trimEnd();
  const after = currentLine.slice(breakAt).trimStart();

  const cursorWasAtEnd = cursor >= lineEnd;

  ta.value = text.slice(0, lineStart) + before + '\n' + after + text.slice(lineEnd);

  const newCursor = cursorWasAtEnd
    ? lineStart + before.length + 1 + after.length
    : lineStart + Math.min(cursor - lineStart, before.length);
  ta.selectionStart = ta.selectionEnd = newCursor;
}

document.getElementById('input').addEventListener('input', () => { enforceLineLimit(); centerIt(); });
</script>
</body>
</html>
